name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: cargo check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # Same cross-arch cache guard as release.yml (macos-latest can be
          # x86_64 or arm64; never restore one arch's artifacts on the other).
          key: ${{ runner.arch }}
      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -e
          for i in 1 2 3; do
            sudo apt-get update && break || { echo "apt-get update failed (attempt $i), retrying..."; sleep 10; }
          done
          sudo apt-get install -y pkg-config libssl-dev libwayland-dev \
            libxkbcommon-dev libx11-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev \
            libxcb-xkb-dev libxrandr-dev libxi-dev libpipewire-0.3-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgbm-dev
        env:
          DEBIAN_FRONTEND: noninteractive
      - name: Check workspace
        run: cargo check --workspace

  test:
    name: cargo test (all crates) (${{ matrix.os }})
    # nuphus-mcp 的协议/安全测试包含真实剪贴板写入（desktop_clipboard_write），
    # 需要桌面会话：windows / macOS runner 具备；Linux headless runner 不跑测试。
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.arch }}
      - name: Run nuphus-mcp tests
        run: cargo test -p nuphus-mcp
      - name: Run desktop-api tests
        run: cargo test -p desktop-api
      - name: Run nuphus-browser unit tests
        # Unit tests only here (the #[ignore]d real-Chrome integration tests get
        # their own job below). No browser is launched by these.
        run: cargo test -p nuphus-browser

  browser-integration:
    name: nuphus-browser real-Chrome integration (windows)
    runs-on: windows-latest
    # Real-Chrome CDP integration tests (7 cases, #[ignore]d by default).
    # windows-latest ships Chrome preinstalled, so the tests are runner-feasible.
    # continue-on-error for the initial rollout: they pass 7/7 locally, but
    # runner timing/profile quirks may differ — visibility first, promotion to
    # a hard gate after a few green weeks. NOTE: batch-B tests that prefer a
    # local OCR model dir already auto-skip that half when models are absent.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.arch }}
      - name: Integration tests (real Chrome, single-threaded)
        # Single-threaded: the tests share one Chrome profile; parallel runs
        # would collide on SingletonLock.
        run: cargo test -p nuphus-browser -- --ignored --test-threads=1

      - name: Build MCP for cross-process browser regression
        run: cargo build -p nuphus-mcp
      - name: Parallel MCP sessions (isolated headless Chrome)
        shell: pwsh
        run: |
          $chrome = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) { throw "Chrome not found" }
          python scripts/test_parallel_mcp.py --binary target/debug/nuphus-mcp.exe --chrome "$chrome"

  audit:
    name: cargo audit (advisory)
    runs-on: ubuntu-latest
    # Hard gate since v0.1.8: the advisory backlog (RUSTSEC-2026-0194/0195,
    # quick-xml build-dep via xcb) is triaged in .cargo/audit.toml with rationale.
    # New vulnerabilities now block merges.
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit

  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --check

  # Guards the idempotency rules the release job depends on: "already published"
  # must be verified against the registry (never inferred from an error string —
  # the 0.1.5 ghost publish) and never faked when the version is absent
  # (the 0.3.4 failure mode). Seconds to run, no network.
  release-scripts:
    name: npm publish helper (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests for scripts/publish-npm-packages.js
        run: node --test scripts/tests/publish-npm-packages.test.js
  # dom_read.js is embedded into browser_exec's `read` step at compile time;
  # this suite pins its match-before-truncate and completion-receipt semantics.
  # Pure Node, no browser, seconds to run.
  dom-read:
    name: dom_read node tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: dom_read.js unit tests
        run: node --test crates/nuphus-mcp/tests/dom_read.cjs

  # End-to-end proof that browser_type reports delivery from the target's own
  # frame (cross-origin iframe terminal), and that trusted clicks land inside
  # frames. Real headless Chrome with an isolated profile; windows-latest ships
  # Chrome preinstalled. continue-on-error for the initial rollout, same policy
  # as browser-integration.
  mcp-type-receipt:
    name: browser_type receipt e2e (windows)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.arch }}
      - name: Build nuphus-mcp
        run: cargo build -p nuphus-mcp
      - name: Type receipt e2e (isolated headless Chrome)
        shell: pwsh
        run: |
          $chrome = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) { throw "Chrome not found" }
          python scripts/test_type_receipt.py --binary target/debug/nuphus-mcp.exe --chrome "$chrome"
