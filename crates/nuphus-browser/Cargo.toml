[package]
name = "nuphus-browser"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/mrpulor-gh/nuphus-mcp"
description = "Nuphus browser automation core (CDP, chromiumoxide) - shared by nuphus and nuphus-mcp"
authors = ["Nuphus Team"]

[dependencies]
# Chrome DevTools Protocol (browser automation)
chromiumoxide = { version = "0.9", default-features = false, features = ["bytes"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"

# Screen size probing (viewport init)
# 0.9.x: same Monitor::all() API; fixes aarch64-apple-darwin compile error
# in 0.0.14 and dedupes the tree (desktop-api already uses 0.9.x).
xcap = "0.9"

# File upload base64 encoding
base64 = "0.22"

# External CDP endpoint discovery (GET {url}/json/version, plain HTTP only)
# Reuses the reqwest 0.13 already pulled in by chromiumoxide — no new dependency tree.
reqwest = { version = "0.13", default-features = false, features = ["json"] }

# MIME detection (file upload)
mime_guess = "2"

# Process scan for external (fingerprint) browser self-healing — locating the
# window process by exe path and reading its --remote-debugging-port cmdline.
# Same version as src-tauri (workspace-wide 0.32).
sysinfo = "0.32"

# Download directory file times
chrono = "0.4"

# Data directory probing (profile dir)
dirs = "5"
sha2 = "0.10"