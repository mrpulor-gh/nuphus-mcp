[package]
name = "desktop-api"
version = "2.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/mrpulor-gh/nuphus-mcp"
authors = ["Nuphus Team"]
description = "Nuphus desktop control core infrastructure - perceive, find, act, communicate"
rust-version = "1.78"

[features]
default = []
http-server = ["dep:axum", "dep:tower"]
http = ["http-server"]

[dependencies]
# Async runtime
tokio = { version = "1.37", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }

# HTTP service
axum = { version = "0.7", features = ["macros"], optional = true }
tower = { version = "0.4", features = ["timeout"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Screenshot
xcap = "0.9.8"

# Image processing (png/jpeg/bmp for reading screenshot and template input)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
rusttype = "0.9"

# Color
palette = "0.7"

# Cache
lru = "0.12"

# base64
base64 = "0.22"

# ONNX Runtime (YOLO element detection / PaddleOCR)
# Pinned to =2.0.0-rc.12: rc.13 requires a newer onnxruntime (1.26 reports BadVersion).
# Kept consistent with the main repo Cargo.lock so the main workspace and this repo behave identically.
# default-features = false: the ort defaults pull ort-sys/download-binaries +
# ort-sys/tls-native, which make ort-sys's build script link a system OpenSSL
# (ureq -> native-tls). On linux-arm64 that OpenSSL build script runs for the
# HOST and got polluted by the arm64 PKG_CONFIG_PATH (elf64-x86-64 mismatch on
# libssl.so). load-dynamic already implies std + preload-dylibs +
# ort-sys/disable-linking; nuphus-mcp's build.rs downloads the ONNX Runtime
# itself, so download-binaries/tls-native/copy-dylibs are unnecessary.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["load-dynamic", "ndarray", "api-24", "tracing"] }
ndarray = "0.17"

# App data directory
dirs = "5"

reqwest = { version = "0.12", features = ["json"], optional = true }

[target.'cfg(not(windows))'.dependencies]
# Non-Windows mouse/keyboard (macOS + Linux via enigo)
enigo = "0.2"
# macOS clipboard
arboard = "3.4"

[target.'cfg(windows)'.dependencies]
# Windows API (Windows only)
windows = { version = "0.56", features = [
    "Win32",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }

[dev-dependencies]
tokio-test = "0.4"